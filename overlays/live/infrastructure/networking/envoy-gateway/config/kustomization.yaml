apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../../infrastructure/networking/envoy-gateway/config
generators:
  - local-config-generator.yaml
replacements:
  - source:
      kind: Secret
      name: envoy-gateway-local-config
      fieldPath: stringData.load-balancer-address
    targets:
      - select:
          kind: Gateway
          name: public
        fieldPaths:
          - spec.addresses.0.value
