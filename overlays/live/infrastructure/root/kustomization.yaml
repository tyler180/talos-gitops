apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../infrastructure
generators:
  - local-config-generator.yaml
replacements:
  - source:
      kind: Secret
      name: infrastructure-local-config
      fieldPath: stringData.node-address-cidr
    targets:
      - select:
          kind: Application
          name: kubelet-csr-approver
        fieldPaths:
          - spec.source.helm.valuesObject.providerIpPrefixes.0
  - source:
      kind: Secret
      name: infrastructure-local-config
      fieldPath: stringData.node-name-regex
    targets:
      - select:
          kind: Application
          name: kubelet-csr-approver
        fieldPaths:
          - spec.source.helm.valuesObject.providerRegex
