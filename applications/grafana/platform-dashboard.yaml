apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  platform-observability.json: |-
    {
      "uid": "platform-observability",
      "title": "Platform / Argo CD and Authentik",
      "tags": [
        "platform",
        "argocd",
        "authentik"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Argo applications",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(argocd_app_info)",
              "legendFormat": "{{namespace}} {{pod}} {{service}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 2,
          "title": "Unhealthy applications",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(argocd_app_info{health_status!~\"Healthy|Progressing|Suspended\"}) or vector(0)",
              "legendFormat": "{{namespace}} {{pod}} {{service}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 3,
          "title": "Out of sync applications",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(argocd_app_info{sync_status=\"OutOfSync\"}) or vector(0)",
              "legendFormat": "{{namespace}} {{pod}} {{service}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 4,
          "title": "Firing alerts",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\",alertname!=\"Watchdog\"}) or vector(0)",
              "legendFormat": "{{namespace}} {{pod}} {{service}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 5,
          "title": "Platform scrape health",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{namespace=~\"argocd|authentik\"}",
              "legendFormat": "{{namespace}} {{pod}} {{service}}",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 6,
          "title": "Platform container memory",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"argocd|authentik\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "{{namespace}} {{pod}} {{service}}",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 7,
          "title": "Platform CPU cores",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{namespace=~\"argocd|authentik\",container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "{{namespace}} {{pod}} {{service}}",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 8,
          "title": "Platform container restarts (1h)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace,pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"argocd|authentik\"}[1h]))",
              "legendFormat": "{{namespace}} {{pod}} {{service}}",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
      ]
    }
