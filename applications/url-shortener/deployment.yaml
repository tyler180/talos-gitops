apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: url-shortener
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: url-shortener
          image: tyler180/url-shortener:git-2f31615@sha256:b4f80c0c802360e1a017a6ed33fb39072834a6236eedb83910e6e61947f01902
          args:
            - -listen=:8080
            - -storage=/videos
            - -base-url=https://url-shortener.k8s.749rmw.com
            - -auth-token=$(AUTH_TOKEN)
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: url-shortener-auth
                  key: token
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /import
              port: http
          livenessProbe:
            httpGet:
              path: /import
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: videos
              mountPath: /videos
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: videos
          persistentVolumeClaim:
            claimName: url-shortener-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
