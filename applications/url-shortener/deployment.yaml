apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: url-shortener
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: url-shortener
          image: tyler180/url-shortener:v0.1.0@sha256:3e65bfa0a14330ba6bcd2434f2762944536b399eef06caedbc12154fb50606c4
          args:
            - -listen=:8080
            - -storage=/videos
            - -base-url=https://vid.749rmw.com
            - -oidc-issuer=https://auth.k8s.749rmw.com/application/o/videohost/
            - -oidc-client-id=$(OIDC_CLIENT_ID)
            - -reddit-cookies=/run/secrets/reddit/cookies.txt
          env:
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: url-shortener-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: url-shortener-oidc
                  key: client-secret
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: url-shortener-oidc
                  key: session-key
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: reddit-session
              mountPath: /run/secrets/reddit
              readOnly: true
            - name: videos
              mountPath: /videos
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: reddit-session
          secret:
            secretName: url-shortener-reddit-session
            defaultMode: 0440
        - name: videos
          persistentVolumeClaim:
            claimName: url-shortener-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
