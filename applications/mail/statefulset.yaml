apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: mail
spec:
  serviceName: stalwart
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v1.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: STALWART_PUBLIC_URL
              value: https://mail-admin.k8s.749rmw.com
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: mail-bootstrap
                  key: recovery-admin
                  optional: true
          ports:
            - {name: management, containerPort: 8080}
            - {name: smtp, containerPort: 25}
            - {name: submissions, containerPort: 465}
            - {name: imaps, containerPort: 993}
            - {name: https, containerPort: 443}
          startupProbe:
            tcpSocket: {port: management}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket: {port: management}
          livenessProbe:
            tcpSocket: {port: management}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - {name: data, mountPath: /etc/stalwart, subPath: etc}
            - {name: data, mountPath: /var/lib/stalwart, subPath: data}
            - {name: logs, mountPath: /var/log/stalwart}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mail-data}
        - name: logs
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
