apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mail-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mail-cp02
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mail-local
  claimRef:
    namespace: mail
    name: mail-data
  local:
    path: /var/lib/kubelet/local-volumes/mail
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [cp02]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-data
  namespace: mail
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mail-local
  volumeName: mail-cp02
  resources:
    requests:
      storage: 50Gi
