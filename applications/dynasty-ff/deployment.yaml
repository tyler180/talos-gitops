apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynasty-ff-frontend
  namespace: dynasty-ff
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dynasty-ff-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynasty-ff-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Public GHCR image built by tyler180/dynasty-ff-frontend on every push to main.
          # NEXT_PUBLIC_* settings (OIDC issuer, client ID, API URL, league) are baked in at build time.
          image: ghcr.io/tyler180/dynasty-ff-frontend@sha256:32699c14042d9f26ffb3486de4603bda7f3fd719d102dd3f9185603cf7f3da82
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The Next.js standalone server writes its cache here.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
