apiVersion: apps/v1
kind: Deployment
metadata:
  name: mm-inches
  namespace: unit-conversions
  labels:
    app.kubernetes.io/name: mm-inches
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mm-inches
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mm-inches
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mm-inches
          image: tyler180/mm-inches@sha256:34037dc81c1a1876b48a3fb83f1cf55ee1b329dc39025af2b7bc7dc2a1d19f22
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mm-inches
