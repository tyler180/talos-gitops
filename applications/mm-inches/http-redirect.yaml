apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mm-inches-http-redirect
  namespace: unit-conversions
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - units.k8s.749rmw.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301