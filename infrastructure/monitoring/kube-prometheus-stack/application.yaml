apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "91.5.1"
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        alertmanager:
          enabled: true
          # Keep alerts visible locally; add a notification receiver separately.
          alertmanagerSpec:
            retention: 120h
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

        defaultRules:
          rules:
            alertmanager: true
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false

        additionalPrometheusRulesMap:
          platform-health:
            groups:
              - name: platform.gitops
                rules:
                  - alert: ArgoApplicationUnhealthy
                    expr: argocd_app_info{health_status!~"Healthy|Progressing|Suspended"} == 1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Argo CD application {{ $labels.name }} is unhealthy'
                      description: 'Application health has been {{ $labels.health_status }} for 10 minutes. Inspect its resources in Argo CD.'
                  - alert: ArgoApplicationOutOfSync
                    expr: argocd_app_info{sync_status="OutOfSync"} == 1
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Argo CD application {{ $labels.name }} is out of sync'
                      description: 'The application has differed from its desired state for 30 minutes. Review its diff before syncing.'
                  - alert: ArgoControllerMetricsMissing
                    expr: absent(up{namespace="argocd",service="argocd-application-controller-metrics"})
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: Argo CD controller metrics are missing
                      description: Check the controller metrics Service, ServiceMonitor, and Prometheus discovery.
              - name: platform.identity
                rules:
                  - alert: AuthentikServerMetricsMissing
                    expr: absent(up{namespace="authentik",service="authentik-server-metrics"})
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: Authentik server metrics are missing
                      description: Check the authentik server metrics Service and ServiceMonitor.
                  - alert: AuthentikWorkerMetricsMissing
                    expr: absent(up{namespace="authentik",service="authentik-worker-metrics"})
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: Authentik worker metrics are missing
                      description: Check the authentik worker metrics Service and ServiceMonitor.

        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          defaultDashboardsTimezone: browser
          envFromSecret: grafana-oauth
          initChownData:
            enabled: false
          grafana.ini:
            analytics:
              check_for_updates: false
              reporting_enabled: false
            auth:
              oauth_auto_login: false
              signout_redirect_url: https://auth.k8s.749rmw.com/application/o/grafana/end-session/
            auth.generic_oauth:
              allow_sign_up: true
              api_url: https://auth.k8s.749rmw.com/application/o/userinfo/
              auth_url: https://auth.k8s.749rmw.com/application/o/authorize/
              enabled: true
              name: authentik
              role_attribute_path: "contains(entitlements[*], 'Grafana Admins') && 'Admin' || contains(entitlements[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
              scopes: openid profile email entitlements offline_access
              token_url: https://auth.k8s.749rmw.com/application/o/token/
              use_refresh_token: true
            security:
              cookie_secure: true
            server:
              domain: grafana.k8s.749rmw.com
              enable_gzip: true
              root_url: https://grafana.k8s.749rmw.com
            users:
              allow_sign_up: false
          persistence:
            enabled: true
            type: sts
            storageClassName: nas-nfs
            accessModes:
              - ReadWriteOnce
            size: 5Gi
            finalizers:
              - kubernetes.io/pvc-protection
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

        kubeControllerManager:
          enabled: false

        kubeEtcd:
          enabled: false

        kubeProxy:
          enabled: false

        kubeScheduler:
          enabled: false

        prometheus:
          prometheusSpec:
            enableAdminAPI: false
            evaluationInterval: 30s
            externalLabels:
              cluster: talos-physical
            podMonitorSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            probeSelector: {}
            probeSelectorNilUsesHelmValues: false
            replicas: 1
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 3Gi
            retention: 15d
            retentionSize: 16GB
            ruleSelector: {}
            ruleSelectorNilUsesHelmValues: false
            scrapeConfigSelector: {}
            scrapeConfigSelectorNilUsesHelmValues: false
            scrapeInterval: 30s
            serviceMonitorSelector: {}
            serviceMonitorSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: monitoring-local
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 30Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
