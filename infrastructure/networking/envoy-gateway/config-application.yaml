apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tyler180/talos-gitops.git
    targetRevision: main
    path: infrastructure/networking/envoy-gateway/config
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
