apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tyler180/talos-gitops.git
    targetRevision: main
    path: infrastructure/networking/metallb/config
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system