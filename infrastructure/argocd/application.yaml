apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: "10.1.2"
    helm:
      releaseName: argocd
      valuesObject:
        controller:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        server:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        applicationSet:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        notifications:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        configs:
          cm:
            url: https://argocd.k8s.749rmw.com
            kustomize.buildOptions: --enable-alpha-plugins --enable-exec
          params:
            server.insecure: true
        repoServer:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /sops-age/keys.txt
          initContainers:
            - name: install-ksops
              image: viaductoss/ksops:v4.5.1
              command: [/usr/local/bin/ksops, install, /custom-tools]
              volumeMounts:
                - name: custom-tools
                  mountPath: /custom-tools
          volumes:
            - name: custom-tools
              emptyDir: {}
            - name: sops-age
              secret:
                secretName: sops-age
          volumeMounts:
            - name: custom-tools
              mountPath: /usr/local/bin/ksops
              subPath: ksops
            - name: sops-age
              mountPath: /sops-age
              readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
