apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tyler180/talos-gitops.git
    targetRevision: main
    path: applications/whoami
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  syncPolicy:
    syncOptions:
      - CreateNamespace=true