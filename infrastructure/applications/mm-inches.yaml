apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mm-inches
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tyler180/talos-gitops.git
    targetRevision: main
    path: applications/mm-inches
  destination:
    server: https://kubernetes.default.svc
    namespace: unit-conversions
  syncPolicy:
    syncOptions:
      - CreateNamespace=true