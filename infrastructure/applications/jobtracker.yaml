apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jobtracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tyler180/talos-gitops.git
    targetRevision: main
    path: applications/jobtracker
  destination:
    server: https://kubernetes.default.svc
    namespace: jobtracker
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
