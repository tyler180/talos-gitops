apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tyler180/talos-gitops.git
    targetRevision: main
    path: overlays/live/infrastructure/cert-manager/config
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
